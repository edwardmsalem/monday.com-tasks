# Railway configuration
# See: https://docs.railway.app/reference/config-as-code

[build]
# No secrets needed at build time - TypeScript compilation only
# All env vars are read at runtime, not build time

[deploy]
# startCommand removed - set per-service in Railway dashboard
# Main server: node dist/server.js
# Presale scanner: node dist/presaleServer.js
healthcheckPath = "/health"
healthcheckTimeout = 30
